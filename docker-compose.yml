services:
  frontend:
    image: node:22
    container_name: frontend_reactjs
    environment:
      - NODE_OPTIONS=--openssl-legacy-provider
    working_dir: /usr/src/app
    volumes:
      - ./app:/usr/src/app
    ports:
      - "3000:3000"
    command: ["tail", "-f", "/dev/null"]
    networks:
      - node_network

networks:
  node_network:
    driver: bridge
